<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur d'Heures & Pointage</title>
  <style>
    :root {
      --bg: #f1f5f9; --card-bg: #ffffff; --card-border: #e2e8f0;
      --text-main: #0f172a; --text-muted: #64748b;
      --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #eef2ff; --primary-border: #c7d2fe;
      --success: #16a34a; --success-light: #f0fdf4; --success-border: #bbf7d0;
      --danger: #dc2626; --danger-light: #fef2f2; --danger-border: #fecaca;
      --warning: #d97706; --warning-light: #fffbeb; --warning-border: #fde68a;
      --input-bg: #f8fafc; --footer-bg: #f8fafc; --footer-border: #edf2f7;
      --radius: 12px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a; --card-bg: #1e293b; --card-border: #334155;
        --text-main: #f8fafc; --text-muted: #94a3b8;
        --primary: #6366f1; --primary-hover: #818cf8; --primary-light: #1e1b4b; --primary-border: #3730a3;
        --success: #4ade80; --success-light: #064e3b; --success-border: #065f46;
        --danger: #f87171; --danger-light: #450a0a; --danger-border: #7f1d1d;
        --warning: #fbbf24; --warning-light: #451a03; --warning-border: #78350f;
        --input-bg: #0f172a; --footer-bg: #0f172a; --footer-border: #334155;
      }
      .stat-card.highlight { background: linear-gradient(135deg, #1e1b4b 0%, #1e293b 100%); }
      .sim-result { background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); border-color: var(--primary-border); }
      #simResultVal { color: #818cf8 !important; }
      .btn-outline { background: var(--card-bg); border-color: var(--card-border); color: var(--text-muted); }
      .btn-outline:hover { background: #334155; color: var(--text-main); }
      .nav-tabs { background: #334155; }
      .tab-btn.active { background: var(--card-bg); color: var(--primary); }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 24px 16px; font-size: 14px; -webkit-font-smoothing: antialiased; }
    .max-w { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
    .brand h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .brand p { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease; outline: none; text-decoration: none; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(79,70,229,0.25); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-sync { background: #059669; color: #fff; font-weight: 700; box-shadow: 0 1px 2px rgba(5,150,105,0.25); }
    .btn-sync:hover { background: #047857; transform: translateY(-1px); }
    .btn-outline { background: var(--card-bg); border-color: var(--card-border); color: var(--text-muted); }
    .btn-outline:hover { background: var(--footer-bg); color: var(--text-main); border-color: var(--text-muted); }
    .btn-danger-subtle { background: var(--danger-light); color: var(--danger); border-color: var(--danger-border); }
    .btn-danger-subtle:hover { background: var(--danger-border); }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; }
    .nav-tabs { display: flex; gap: 4px; background: var(--card-border); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; border: none; background: transparent; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; transition: all 0.15s ease; text-align: center; }
    .tab-btn.active { background: var(--card-bg); color: var(--primary); font-weight: 700; box-shadow: var(--shadow-sm); }
    .rules-bar { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 0.8rem; box-shadow: var(--shadow-sm); }
    .tag { background: var(--input-bg); border: 1px solid var(--card-border); padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
    .stat-card.highlight { background: linear-gradient(135deg, var(--primary-light) 0%, var(--card-bg) 100%); border-color: var(--primary-border); }
    .stat-header { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 6px; }
    .stat-val { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
    .stat-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .val-plus { color: var(--success); }
    .val-minus { color: var(--danger); }
    .val-neutral { color: var(--text-main); }
    .progress-container { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
    .progress-track { width: 100%; height: 16px; background: var(--input-bg); border-radius: 999px; overflow: hidden; position: relative; border: 1px solid var(--card-border); }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.4s ease; }
    .target-banner { background: var(--primary-light); border: 1px solid var(--primary-border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 0.85rem; color: var(--text-main); }
    .days-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 16px; }
    .day-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; }
    .day-card.today { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary), var(--shadow-sm); }
    .day-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .day-name { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
    .badge { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
    .badge-today { background: var(--primary-light); color: var(--primary); }
    .badge-conge { background: var(--success-light); color: var(--success); border: 1px solid var(--success-border); }
    .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .field label { display: block; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .field input { width: 100%; border: 1px solid var(--card-border); background: var(--input-bg); border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; font-weight: 600; color: var(--text-main); text-align: center; transition: all 0.15s; outline: none; }
    .field input:focus { border-color: var(--primary); background: var(--card-bg); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .field input.warn { border-color: var(--warning); background: var(--warning-light); }
    .warn-msg { color: var(--warning); font-size: 0.7rem; font-weight: 600; margin-top: 4px; }
    .card-footer { background: var(--footer-bg); border: 1px solid var(--footer-border); border-radius: 8px; padding: 10px 14px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 0.82rem; }
    .sim-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); }
    .sim-result { background: linear-gradient(135deg, var(--primary-light) 0%, var(--footer-bg) 100%); border: 1px solid var(--primary-border); border-radius: 10px; padding: 24px; text-align: center; margin-top: 20px; }
    .absence-badge { display: inline-flex; background: var(--primary-light); color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-bottom: 12px; border: 1px solid var(--primary-border); }
  </style>
</head>
<body>
<div class="max-w">
  <header>
    <div class="brand">
      <h1>⏱️ Compteur d'Heures</h1>
      <p>Suivi intelligent & synchronisation directe ADP</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="installerTampermonkey()" title="Installer l'extension pour ton navigateur">🧩 1. Installer Tampermonkey</button>
      <a class="btn btn-outline" href="https://raw.githubusercontent.com/Raikounet/compteur-heures/main/adp-sync.user.js" target="_blank" title="Ajouter le script d'automatisation dans Tampermonkey">🐒 2. Installer Script</a>
      <button class="btn btn-sync" onclick="triggerADPSync()">⚡ Synchro ADP</button>
      <button class="btn btn-outline" onclick="copySummary()">📋 Copier</button>
      <button class="btn btn-danger-subtle" onclick="resetWeek()">🔄 Réinitialiser</button>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" id="tab-btn-37" onclick="setTab('37h')">💼 Semaine 37h (7h24/j)</button>
    <button class="tab-btn" id="tab-btn-35" onclick="setTab('35h')">🛡️ Chômage Partiel (35h)</button>
    <button class="tab-btn" id="tab-btn-sim" onclick="setTab('sim')">🎯 Simulateur Inversé</button>
  </nav>

  <div class="rules-bar">
    <span style="font-weight: 600; color: var(--text-muted);">Plages autorisées :</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <span class="tag">Matin : 06h30 - 09h00</span>
      <span class="tag">Midi : 12h00 - 14h00 (Min. 45m)</span>
      <span class="tag">Soir : 16h00 - 18h30</span>
    </div>
  </div>

  <div id="view-timesheet">
    <div id="chomage-box" class="stat-card" style="display: none; background: var(--warning-light); border-color: var(--warning-border); margin-bottom: 20px;">
      <label style="display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; color: var(--text-main);">
        <input type="checkbox" id="vendrediChome" onchange="toggleVendrediChome()" style="transform: scale(1.2);">
        <span>Vendredi chômé (Semaine de 28h00 sur 4 jours)</span>
      </label>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">Report Lundi Matin</div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 6px;">
          <button class="btn btn-outline btn-sm" id="carrySignBtn" onclick="toggleCarrySign()" style="font-weight: 800; padding: 4px 8px;">+</button>
          <input type="number" id="carryH" min="0" max="99" value="0" style="width: 48px; border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text-main); border-radius: 6px; padding: 4px; text-align: center; font-weight: 700;" oninput="onCarryManualInput()"> h
          <input type="number" id="carryM" min="0" max="59" value="0" style="width: 48px; border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text-main); border-radius: 6px; padding: 4px; text-align: center; font-weight: 700;" oninput="onCarryManualInput()"> m
        </div>
      </div>
